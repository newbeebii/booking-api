<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Daftar Booking - FieldPro</title>
  
  <!-- Tailwind CSS & Icons -->
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
  
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            brand: {
              green: '#00C853',
              dark: '#0A0F1C',
              card: '#111827',
              border: '#1F2A3A',
              muted: '#6B7A99',
              red: '#FF3B30',
            }
          },
          fontFamily: {
            sans: ['Inter', 'sans-serif'],
          }
        }
      }
    }
  </script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet" />
  
  <style>
    body { font-family: 'Inter', sans-serif; background-color: #0A0F1C; color: white; }
    .hero-bg { background: radial-gradient(circle at top right, rgba(0,200,83,0.08) 0%, transparent 50%), radial-gradient(circle at bottom left, rgba(0,200,83,0.05) 0%, transparent 40%), #0A0F1C; }
    .input-focus:focus { border-color: #00C853; box-shadow: 0 0 0 1px #00C853; }
    .table-row:hover { background-color: rgba(31, 42, 58, 0.3); }
  </style>
</head>
<body class="hero-bg min-h-screen flex flex-col">

  <!-- NAVIGATION BAR -->
  <header class="border-b border-brand-border bg-brand-dark/80 backdrop-blur-md sticky top-0 z-50">
    <div class="max-w-7xl mx-auto px-6 flex items-center justify-between h-16">
      <div class="flex items-center gap-2">
        <div class="w-8 h-8 bg-brand-green rounded-lg flex items-center justify-center">
          <i class="fa-solid fa-bolt text-brand-dark text-sm"></i>
        </div>
        <span class="text-xl font-bold">Field<span class="text-brand-green">Pro</span></span>
      </div>
      <nav class="hidden md:flex items-center gap-6">
        <a href="../index.html" class="text-brand-muted hover:text-white text-sm transition-colors">Lapangan</a>
        <a href="#" class="text-white text-sm font-medium">Jadwal</a>
        <a href="../tambahBookings/index.html" class="text-brand-muted hover:text-white text-sm transition-colors">Tambah Booking</a>
      </nav>
      <div class="flex items-center gap-4">
        <button class="w-8 h-8 rounded-full border border-brand-border flex items-center justify-center overflow-hidden">
          <img src="https://storage.googleapis.com/uxpilot-auth.appspot.com/avatars/avatar-1.jpg" alt="Avatar" class="w-full h-full object-cover">
        </button>
      </div>
    </div>
  </header>

  <!-- MAIN CONTENT -->
  <main class="max-w-7xl mx-auto px-6 py-12 flex-1 w-full">
    
    <!-- Title & Action Buttons -->
    <div class="flex flex-col md:flex-row md:items-center justify-between gap-6 mb-10">
      <div>
        <h1 class="text-4xl font-extrabold tracking-tight mb-2">Daftar Booking</h1>
        <p class="text-brand-muted">Kelola semua reservasi lapangan Anda dalam satu tempat.</p>
      </div>
      <div class="flex flex-wrap gap-3">
        <a href="../tambahBookings/index.html" class="inline-flex items-center gap-2 px-5 py-2.5 bg-brand-green text-brand-dark text-sm font-bold rounded-xl hover:shadow-[0_0_20px_rgba(0,200,83,0.3)] transition-all">
          <i class="fa-solid fa-plus text-xs"></i> Tambah Booking
        </a>
      </div>
    </div>

    <!-- Search Input -->
    <div class="mb-6">
      <div class="relative max-w-md">
        <div class="absolute inset-y-0 left-0 pl-4 flex items-center pointer-events-none">
          <i class="fa-solid fa-magnifying-glass text-brand-muted"></i>
        </div>
        <input 
          type="text" 
          id="searchInput" 
          placeholder="Cari nama customer..." 
          class="w-full bg-brand-card border border-brand-border text-white text-sm rounded-xl pl-11 pr-4 py-3 focus:outline-none input-focus transition-all"
        >
      </div>
    </div>

    <!-- Dynamic Table Card -->
    <div class="bg-brand-card border border-brand-border rounded-2xl overflow-hidden">
      <div class="overflow-x-auto">
        <table id="bookingsTable" class="w-full text-left border-collapse">
          <thead>
            <tr class="bg-brand-dark/50 border-b border-brand-border">
              <th class="px-6 py-4 text-[10px] font-bold uppercase tracking-widest text-brand-muted">Lapangan</th>
              <th class="px-6 py-4 text-[10px] font-bold uppercase tracking-widest text-brand-muted">Customer</th>
              <th class="px-6 py-4 text-[10px] font-bold uppercase tracking-widest text-brand-muted">No. HP</th>
              <th class="px-6 py-4 text-[10px] font-bold uppercase tracking-widest text-brand-muted">Tanggal</th>
              <th class="px-6 py-4 text-[10px] font-bold uppercase tracking-widest text-brand-muted">Jam</th>
              <th class="px-6 py-4 text-[10px] font-bold uppercase tracking-widest text-brand-muted text-center">Status</th>
              <th class="px-6 py-4 text-[10px] font-bold uppercase tracking-widest text-brand-muted text-right">Aksi</th>
            </tr>
          </thead>
          
          <!-- ISI DATA AKAN DI-RENDER OLEH SCRIPT.JS DI SINI -->
          <tbody id="bookingsTableBody" class="divide-y divide-brand-border">
          </tbody>
        </table>
      </div>

      <!-- Table Footer / Pagination -->
      <div class="bg-brand-dark/30 px-6 py-4 flex items-center justify-between border-t border-brand-border">
        <p class="text-xs text-brand-muted">Menampilkan data booking</p>
        <div class="flex gap-2">
          <button class="px-3 py-1 bg-brand-dark border border-brand-border text-xs rounded hover:bg-brand-border disabled:opacity-50" disabled>Previous</button>
          <button class="px-3 py-1 bg-brand-dark border border-brand-border text-xs rounded hover:bg-brand-border">Next</button>
        </div>
      </div>
    </div>
  </main>

  <!-- FOOTER -->
  <footer class="max-w-7xl mx-auto px-6 py-8 border-t border-brand-border mt-auto w-full">
    <div class="flex flex-col md:flex-row justify-between items-center gap-4">
      <p class="text-brand-muted text-xs">© 2025 FieldPro Admin Panel. All rights reserved.</p>
      <div class="flex gap-6">
        <a href="#" class="text-brand-muted hover:text-white text-xs transition-colors">Help Center</a>
        <a href="#" class="text-brand-muted hover:text-white text-xs transition-colors">Privacy Policy</a>
      </div>
    </div>
  </footer>

  <!-- Script JS Kamu -->
  <script src="script.js"></script>
</body>
</html>
