<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>BookingLapangan.com - Daftar Lapangan Aktif</title>
    <!-- Menghubungkan ke file CSS external -->
    <link rel="stylesheet" href="style.css" />
    <!-- Menghubungkan ke icon font (opsional, untuk ikon Futsal/Badminton) -->
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css"
    />
  </head>
  <body>
    <!-- Header / Navigasi -->
    <header class="main-header">
      <div class="container header-container">
        <div class="logo">
          <span class="logo-b">B</span>
          <span class="logo-text"
            >BOOKING<span class="text-orange">LAPANGAN</span>.COM</span
          >
        </div>
        <nav class="main-nav">
          <ul>
            <li><a href="#" class="active">Lapangan</a></li>
            <li><a href="bookings/index.html">Booking</a></li>
            <li><a href="#" class="logout-btn">Logout</a></li>
          </ul>
        </nav>
      </div>
    </header>
    <body>
      <!-- Konten Utama -->
      <main class="container">
        <!-- Bagian Aksi Atas (Cari & Tambah) -->
        <section class="action-bar">
          <div class="search-wrapper">
            <i class="fas fa-search search-icon"></i>
            <input
              type="text"
              id="searchInput"
              placeholder="Cari nama lapangan..."
            />
          </div>
          <a href="tambahFields/index.html" class="btn btn-orange">
            <i class="fas fa-plus-circle"></i> TAMBAH LAPANGAN BARU
          </a>
        </section>

        <!-- Bagian Tabel Data -->
        <section class="table-container">
          <h2 class="section-title">DAFTAR LAPANGAN AKTIF</h2>

          <table id="fieldsTable">
            <thead>
              <tr>
                <th>Nama Lapangan</th>
                <th>Tipe</th>
                <th>Harga/Jam</th>
                <th>Lokasi</th>
                <th>Aksi</th>
              </tr>
            </thead>
            <tbody id="fieldsTableBody"></tbody>
          </table>
        </section>
      </main>

      <!-- Footer -->
      <footer class="main-footer container">
        <p>&copy; 2024 BookingLapangan.com. Hak Cipta Dilindungi.</p>
      </footer>
    </body>

    <script src="script.js"></script>
  </body>
</html>
